<label class="sic-field">
  @if (label) {
    <span class="sic-field__label">{{ label }}</span>
  }

  <span class="sic-colorpicker__wrap sic-control-field" [class.sic-control-field--invalid]="showError">
    <input
      type="color"
      class="sic-colorpicker__swatch"
      [class.sic-colorpicker__swatch--empty]="!value"
      [disabled]="disabled"
      [value]="swatchValue"
      (input)="handleColorInput($event)"
      (blur)="handleBlur()"
    />
    @if (allowText) {
      <input
        type="text"
        class="sic-colorpicker__hex"
        [disabled]="disabled"
        [readOnly]="readonly"
        [value]="value ?? ''"
        (input)="handleTextInput($event)"
        (blur)="handleTextBlur($event)"
      />
    }
    @if (showClear) {
      <button
        type="button"
        class="sic-field-clear-btn sic-colorpicker__clear"
        tabindex="-1"
        aria-label="Clear"
        (mousedown)="$event.preventDefault()"
        (click)="clear($event)"
      >
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <line x1="6" y1="6" x2="18" y2="18" />
          <line x1="18" y1="6" x2="6" y2="18" />
        </svg>
      </button>
    }
  </span>

  @if (showError && errorMessage) {
    <span class="sic-field__error">{{ errorMessage }}</span>
  } @else if (hint) {
    <span class="sic-field__hint">{{ hint }}</span>
  }
</label>

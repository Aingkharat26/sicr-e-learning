<div class="sic-video-player__wrap">
  <video
    #video
    class="sic-video-player__video"
    [src]="src"
    [poster]="poster"
    [autoplay]="autoplay"
    [loop]="loop"
    [muted]="muted"
    [preload]="preload"
    controls
    (play)="playing = true"
    (pause)="playing = false"
  ></video>

  @if (!playing) {
    <button type="button" class="sic-video-player__play-btn" [attr.aria-label]="playLabel" (click)="togglePlay()">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <path d="M8 5v14l11-7z" />
      </svg>
    </button>
  }
</div>

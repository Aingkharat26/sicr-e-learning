<label class="sic-field">
  @if (label) {
    <span class="sic-field__label">
      {{ label }}
      @if (isRequired) {
        <span class="sic-field__required">*</span>
      }
    </span>
  }

  <span class="sic-input-password__wrap">
    <input
      class="sic-input-password__field"
      [class.sic-input-password__field--invalid]="showError"
      [type]="revealed ? 'text' : 'password'"
      [name]="name"
      [placeholder]="placeholder"
      [autocomplete]="autocomplete"
      [readOnly]="readonly"
      [disabled]="disabled"
      [value]="value"
      (input)="handleInput($event)"
      (blur)="handleBlur()"
    />
    <button
      type="button"
      class="sic-input-password__toggle"
      tabindex="-1"
      [disabled]="disabled"
      (click)="toggleReveal()"
      [attr.aria-label]="revealed ? 'Hide password' : 'Show password'"
    >
      @if (revealed) {
        <svg
          class="sic-input-password__icon"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z" />
          <line x1="3" y1="3" x2="21" y2="21" />
        </svg>
      } @else {
        <svg
          class="sic-input-password__icon"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z" />
          <circle cx="12" cy="12" r="3" />
        </svg>
      }
    </button>
  </span>

  @if (showError && errorMessage) {
    <span class="sic-field__error">{{ errorMessage }}</span>
  } @else if (hint) {
    <span class="sic-field__hint">{{ hint }}</span>
  }
</label>

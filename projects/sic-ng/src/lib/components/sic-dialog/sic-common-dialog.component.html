<div class="sic-common-dialog">
  <span class="sic-common-dialog__icon sic-common-dialog__icon--{{ data.type }}">
    @switch (data.type) {
      @case ('success') {
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M20 6 9 17l-5-5" />
        </svg>
      }
      @case ('danger') {
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M18 6 6 18M6 6l12 12" />
        </svg>
      }
      @case ('warning') {
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 9v4M12 17h.01" />
          <path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0Z" />
        </svg>
      }
      @default {
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 16v-4M12 8h.01" />
          <circle cx="12" cy="12" r="9" />
        </svg>
      }
    }
  </span>

  <h3 class="sic-common-dialog__title">{{ data.title }}</h3>
  <p class="sic-common-dialog__description">{{ data.description }}</p>

  <div class="sic-common-dialog__actions">
    @if (isConfirm) {
      <sic-button variant="ghost" (click)="close(false)">{{ cancelText }}</sic-button>
      <sic-button variant="solid" [color]="buttonColor" (click)="close(true)">{{ confirmText }}</sic-button>
    } @else {
      <sic-button variant="solid" [color]="buttonColor" (click)="close()">{{ closeText }}</sic-button>
    }
  </div>
</div>
